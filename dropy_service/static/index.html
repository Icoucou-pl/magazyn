<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal partnera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.975 0.004 250);--surface:#fff;--sunk:oklch(0.955 0.006 250);
  --ink:oklch(0.23 0.02 260);--muted:oklch(0.5 0.02 260);--line:oklch(0.9 0.008 260);
  --accent:oklch(0.47 0.13 262);--on-accent:#fff;
  --ok:oklch(0.52 0.12 155);--warn:oklch(0.6 0.14 65);--bad:oklch(0.54 0.18 27);--info:oklch(0.5 0.1 240);
  color-scheme:light;
}
/* Ciemny motyw: z ustawień systemu, dopóki użytkownik sam nie wybierze,
   i twardo po kliknięciu przełącznika (data-theme na <html>, jak w Magazynie). */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.18 0.01 260);--surface:oklch(0.22 0.012 260);--sunk:oklch(0.2 0.01 260);
  --ink:oklch(0.94 0.005 260);--muted:oklch(0.7 0.015 260);--line:oklch(0.32 0.012 260);
  --accent:oklch(0.72 0.12 262);--on-accent:oklch(0.18 0.02 260);
  --ok:oklch(0.76 0.13 155);--warn:oklch(0.8 0.13 75);--bad:oklch(0.72 0.15 27);--info:oklch(0.76 0.1 240);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:oklch(0.18 0.01 260);--surface:oklch(0.22 0.012 260);--sunk:oklch(0.2 0.01 260);
  --ink:oklch(0.94 0.005 260);--muted:oklch(0.7 0.015 260);--line:oklch(0.32 0.012 260);
  --accent:oklch(0.72 0.12 262);--on-accent:oklch(0.18 0.02 260);
  --ok:oklch(0.76 0.13 155);--warn:oklch(0.8 0.13 75);--bad:oklch(0.72 0.15 27);--info:oklch(0.76 0.1 240);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:oklch(0.975 0.004 250);--surface:#fff;--sunk:oklch(0.955 0.006 250);
  --ink:oklch(0.23 0.02 260);--muted:oklch(0.5 0.02 260);--line:oklch(0.9 0.008 260);
  --accent:oklch(0.47 0.13 262);--on-accent:#fff;
  --ok:oklch(0.52 0.12 155);--warn:oklch(0.6 0.14 65);--bad:oklch(0.54 0.18 27);--info:oklch(0.5 0.1 240);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.mono,.sku{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
h1,h2,h3{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
small{font-size:12.5px}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.who b{display:block;font-weight:600}
.who span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs button{border:0;background:none;padding:12px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:600}
.badge.warn{background:var(--warn);color:#fff}
main{max-width:1000px;margin:0 auto;padding:22px 20px 110px}
.sechead{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:14px}
.sechead p{margin:4px 0 0;color:var(--muted);font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f>*{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in oklch,var(--c) 14%,transparent)}
.pill.ok{--c:var(--ok)}.pill.warn{--c:var(--warn)}.pill.bad{--c:var(--bad)}.pill.info{--c:var(--info)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13.5px}

/* logowanie */
.login{max-width:380px;margin:12vh auto;padding:0 20px}
.login .card{display:grid;gap:12px}

/* katalog */
.fsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface)}
.fsw button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.fsw button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prod{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace}
/* Powiększenie: osobny element nad listą, więc nie rozpycha wiersza. */
.zoom{position:fixed;z-index:40;width:260px;height:260px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:6px;pointer-events:none}
.zoom img{width:100%;height:100%;object-fit:contain}
@media (hover:none){.zoom{display:none}}
.prod:first-child{border-top:0}
.prod h3{font-size:14.5px;font-weight:500}
.sku{font-size:12px;color:var(--muted)}
.prow{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.pbuy{display:flex;align-items:center;gap:14px}
.price{text-align:right;font-weight:600}
.price small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.step button{border:0;background:none;width:32px;height:34px;cursor:pointer;font-size:17px}
.step span{min-width:24px;text-align:center;font-weight:600}
.cartbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;gap:14px;align-items:center;
  background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);width:min(560px,calc(100% - 24px))}
.cartbar span{flex:1;font-size:14px}
.cartbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* koszyk */
.cline{display:grid;grid-template-columns:40px minmax(0,1fr) auto 90px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cline:first-child{border-top:0;padding-top:0}
.cline .thumb{width:40px;height:40px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.lval{text-align:right;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:12px}
.seg label{text-align:center;padding:7px;border-radius:6px;cursor:pointer;font-size:13.5px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent)}
.check{display:flex;gap:8px;align-items:center;margin:12px 0 0;cursor:pointer;font-size:14px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right}
.sum .big{font-size:18px;font-weight:600}

/* zamówienia */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{display:block;color:var(--muted)}
.kpi b{font-size:19px;font-weight:600}
.kpi.warn b{color:var(--warn)}
.olist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.orow{display:grid;grid-template-columns:minmax(170px,auto) 92px minmax(0,1fr) 110px 150px;gap:14px;align-items:center;width:100%;text-align:left;
  border:0;border-top:1px solid var(--line);background:none;padding:12px 16px;cursor:pointer;color:inherit}
.orow:first-child{border-top:0}
.orow:hover{background:var(--sunk)}
.orow small{display:block;color:var(--muted)}
.oval{text-align:right;font-weight:600}
.orow .pill{justify-self:end}
.odate{color:var(--muted);font-size:13px}

#scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:30}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:31;overflow-y:auto;padding:20px;border-left:1px solid var(--line)}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:10px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;
  cursor:pointer;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;flex:none;color:inherit}
.dsec{margin-top:16px}
.dsec h3{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r{text-align:right}
.callout{border-radius:8px;padding:12px;margin:12px 0;border:1px solid color-mix(in oklch,var(--c) 40%,transparent);background:color-mix(in oklch,var(--c) 9%,transparent)}
.callout.warn{--c:var(--warn)}.callout.bad{--c:var(--bad)}
.callout p{margin:0 0 8px}.callout p:last-child{margin:0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:760px){
  main{padding:16px 14px 110px}
  .prod{grid-template-columns:48px minmax(0,1fr)}
  .prod .pbuy{grid-column:1/-1;justify-content:space-between}
  .cline{grid-template-columns:40px minmax(0,1fr);grid-template-areas:"t n" "s v"}
  .cline .thumb{grid-area:t}.cline>div:nth-child(2){grid-area:n}.cline .step{grid-area:s;justify-self:start}.cline .lval{grid-area:v}
  .grid2,.fgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .orow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nr val" "odb odb" "date st";gap:4px 10px}
  .onr{grid-area:nr}.oval{grid-area:val}.oodb{grid-area:odb}.odate{grid-area:date}.orow .pill{grid-area:st}
  .line{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n n" "s v"}
  .line>div:first-child{grid-area:n}.line .step{grid-area:s;justify-self:start}.lval{grid-area:v}
  #drawer{top:auto;max-height:88vh;border-left:0;border-radius:16px 16px 0 0}
}
</style>
</head>
<body>
<script>
// Ustawiamy motyw przed pierwszym malowaniem — inaczej przy ciemnym widać biały błysk.
(function () {
  var t = localStorage.getItem("drop_theme");
  if (t) document.documentElement.setAttribute("data-theme", t);
})();
</script>

<div id="app"></div>
<div id="cartbar" class="cartbar" hidden></div>
<div id="scrim" data-close hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" hidden><div id="dBody"></div></aside>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const API = "/drop/v1";
const $ = s => document.querySelector(s);
const zl = n => new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN", maximumFractionDigits: 2 }).format(n || 0);
const dm = d => d ? `${d.slice(8,10)}.${d.slice(5,7)}.${d.slice(0,4)}` : "—";
const FN = { amh: "AMH", acti: "Acti4med", veluxa: "Veluxa" };
const fl = s => FN[s] || s;
const STATUS = {
  platnosc:  ["Czeka na płatność", "warn"],
  etykieta:  ["Czeka na etykietę", "warn"],
  nowe:      ["Przyjęte", "info"],
  przyjete:  ["Przyjęte", "info"],
  spakowane: ["Spakowane", "info"],
  wyslane:   ["Wysłane", "ok"],
  anulowane: ["Anulowane", "bad"],
};

const state = {
  token: localStorage.getItem("drop_token") || "",
  me: null, tab: "katalog", firma: null,
  carts: {}, catalogs: {}, orders: null, od: "", do: "", q: "", finanse: null,
};

// ── Zdjęcia ──────────────────────────────────────────────────
const thumb = p => `<div class="thumb"${p.photo_full ? ` data-zoom="${p.photo_full}"` : ""}>` +
  (p.photo_thumb ? `<img src="${p.photo_thumb}" alt="" loading="lazy">` : `<span class="ph">${(p.sku || "").slice(0, 4)}</span>`) +
  `</div>`;

let zoomEl = null;
function hideZoom() { if (zoomEl) { zoomEl.remove(); zoomEl = null; } }

// Powiększenie pokazujemy przy kursorze i trzymamy w granicach okna,
// żeby przy produktach na dole listy nie wyjechało poza ekran.
document.addEventListener("mouseover", e => {
  const t = e.target.closest?.("[data-zoom]");
  if (!t) return;
  hideZoom();
  zoomEl = document.createElement("div");
  zoomEl.className = "zoom";
  zoomEl.innerHTML = `<img src="${t.dataset.zoom}" alt="">`;
  document.body.appendChild(zoomEl);
  const r = t.getBoundingClientRect(), S = 272;
  let left = r.right + 12;
  if (left + S > window.innerWidth) left = Math.max(8, r.left - S - 12);
  zoomEl.style.left = left + "px";
  zoomEl.style.top = Math.min(Math.max(8, r.top - 100), window.innerHeight - S - 8) + "px";
});
document.addEventListener("mouseout", e => { if (e.target.closest?.("[data-zoom]")) hideZoom(); });
window.addEventListener("scroll", hideZoom, true);

// ── Motyw ────────────────────────────────────────────────────
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function currentTheme() {
  return document.documentElement.getAttribute("data-theme")
    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
const themeIcon = () => currentTheme() === "light" ? MOON : SUN;

function toggleTheme() {
  const next = currentTheme() === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("drop_theme", next);
  const b = $("#theme"); if (b) b.innerHTML = themeIcon();
}

function toast(msg, kind) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (kind ? " " + kind : "");
  t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 2800);
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(state.token ? { Authorization: "Bearer " + state.token } : {}), ...(opts.headers || {}) },
  });
  if (r.status === 401) { logout(); throw new Error("Sesja wygasła, zaloguj się ponownie"); }
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.detail) || "Coś poszło nie tak");
  return data;
}

function logout() {
  state.token = ""; state.me = null; localStorage.removeItem("drop_token"); render();
}

// ── Logowanie ────────────────────────────────────────────────
function renderLogin() {
  $("#app").innerHTML = `
    <div class="login">
      <h1 style="font-size:20px;margin-bottom:4px">Portal partnera</h1>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">Zaloguj się danymi od swojego opiekuna.</p>
      <div class="card">
        <label class="f">E-mail<input type="email" id="le" autocomplete="username"></label>
        <label class="f">Hasło<input type="password" id="lp" autocomplete="current-password"></label>
        <button class="btn primary wide" id="lb">Zaloguj</button>
      </div>
    </div>`;
  const go = async () => {
    const email = $("#le").value.trim(), password = $("#lp").value;
    if (!email || !password) return toast("Podaj e-mail i hasło", "bad");
    $("#lb").disabled = true;
    try {
      const r = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
      state.token = r.access_token; localStorage.setItem("drop_token", r.access_token);
      await boot();
    } catch (e) { toast(e.message, "bad"); $("#lb").disabled = false; }
  };
  $("#lb").onclick = go;
  $("#lp").onkeydown = e => { if (e.key === "Enter") go(); };
}

// ── Szkielet ─────────────────────────────────────────────────
function shell(inner) {
  const cartN = Object.values(state.carts).reduce((s, c) => s + Object.values(c).reduce((a, b) => a + b, 0), 0);
  const waiting = (state.orders?.orders || []).filter(o => ["platnosc", "etykieta"].includes(o.status)).length;
  const overdue = (state.finanse?.invoices || []).filter(i => i.overdue).length;
  $("#app").innerHTML = `
    <header class="top">
      <div class="who"><b>${state.me.name}</b><span>Portal partnera, kod ${state.me.code}</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn" id="theme" title="Zmień motyw" aria-label="Zmień motyw">${themeIcon()}</button>
        <button class="btn sm" id="out">Wyloguj</button>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="katalog" aria-selected="${state.tab === "katalog"}">Katalog</button>
      <button role="tab" data-tab="koszyk" aria-selected="${state.tab === "koszyk"}">Koszyk${cartN ? `<span class="badge">${cartN}</span>` : ""}</button>
      <button role="tab" data-tab="zamowienia" aria-selected="${state.tab === "zamowienia"}">Zamówienia${waiting ? `<span class="badge warn">${waiting}</span>` : ""}</button>
      <button role="tab" data-tab="finanse" aria-selected="${state.tab === "finanse"}">Finanse${overdue ? `<span class="badge warn">${overdue}</span>` : ""}</button>
    </nav>
    <main>${inner}</main>`;
  $("#out").onclick = logout;
  $("#theme").onclick = toggleTheme;
  document.querySelectorAll("[role=tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  renderCartBar();
}

function firmSwitch() {
  if (state.me.firmy.length === 1) return `<p class="hint" style="margin:0 0 12px">Kupujesz od <b>${fl(state.me.firmy[0])}</b>.</p>`;
  return `<div style="margin-bottom:12px">
    <div class="fsw">${state.me.firmy.map(f => {
      const n = Object.values(state.carts[f] || {}).reduce((a, b) => a + b, 0);
      return `<button data-firma="${f}" aria-selected="${f === state.firma}">${fl(f)}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
    }).join("")}</div>
    <p class="hint">Każda firma to osobne zamówienie i osobna faktura.</p></div>`;
}

const cart = () => (state.carts[state.firma] ||= {});

function renderCartBar() {
  const bar = $("#cartbar"), c = state.carts[state.firma] || {};
  const n = Object.values(c).reduce((a, b) => a + b, 0);
  const cat = state.catalogs[state.firma];
  if (n && state.tab === "katalog" && cat) {
    const v = Object.entries(c).reduce((s, [sku, q]) => s + (cat.find(p => p.sku === sku)?.price_net || 0) * q, 0);
    bar.innerHTML = `<span>${fl(state.firma)}: ${n} szt., ${zl(v)} netto</span><button class="btn" data-tab="koszyk">Przejdź do koszyka</button>`;
    bar.hidden = false;
    bar.querySelector("[data-tab]").onclick = () => go("koszyk");
  } else bar.hidden = true;
}

async function go(tab) {
  state.tab = tab; window.scrollTo(0, 0);
  if (tab === "katalog") await loadCatalog();
  if (tab === "koszyk") { await ensureCatalog(state.firma); renderCart(); }
  if (tab === "zamowienia") await loadOrders();
  if (tab === "finanse") await loadFinanse();
}

// ── Finanse ──────────────────────────────────────────────────
async function loadFinanse() {
  shell(`<div class="empty">Wczytuję rozliczenia…</div>`);
  try { state.finanse = await api("/finanse"); }
  catch (e) { state.finanse = { summary: {}, invoices: [], payments: [] }; toast(e.message, "bad"); }
  renderFinanse();
}

function renderFinanse() {
  const { summary = {}, invoices = [], payments = [], unbilled = [] } = state.finanse || {};
  const invRows = invoices.map(i => {
    const pill = i.status === "zaplacona" ? `<span class="pill ok">Zapłacona</span>`
      : i.status === "po_terminie" ? `<span class="pill bad">Po terminie</span>`
      : `<span class="pill info">Do zapłaty</span>`;
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
        <div><div class="mono" style="font-weight:500">${i.nr}</div>
          <div style="font-size:12.5px;color:var(--muted)">${fl(i.firma)}${i.okres ? " · " + i.okres : ""} · termin ${dm(i.due_date)}</div></div>
        ${pill}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px">
        <div><small style="color:var(--muted)">Kwota</small><div><b>${zl(i.total_gross)}</b></div></div>
        <div><small style="color:var(--muted)">Zapłacono</small><div><b>${zl(i.paid)}</b></div></div>
        <div><small style="color:var(--muted)">Zostało</small><div><b>${zl(i.left)}</b></div></div>
      </div>
      ${i.pending ? `<p class="hint">Zgłoszona wpłata ${zl(i.pending)} czeka na nasze potwierdzenie.</p>` : ""}
      ${i.orders?.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--accent);font-size:13px">Zamówienia na tej fakturze (${i.orders.length})</summary>
        <table style="margin-top:8px"><tbody>${i.orders.map(o => `<tr><td class="mono" style="font-size:12.5px">${o.nr}</td><td>${o.recipient || "—"}</td><td class="r">${zl(o.total_gross)}</td></tr>`).join("")}</tbody></table></details>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        ${i.pdf_url ? `<a class="btn sm" href="${i.pdf_url}" target="_blank" rel="noreferrer">Pobierz fakturę</a>` : ""}
        ${i.left > 0 ? `<button class="btn sm primary" data-pay="${i.id}" data-left="${i.left}" data-nr="${i.nr}">Zgłoś wpłatę</button>` : ""}
      </div>
    </div>`;
  }).join("");

  const payRows = payments.map(p => `<div style="display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line)">
      <span style="color:var(--muted);font-size:13px">${dm(p.paid_date)}</span>
      <span style="font-size:13.5px">${p.invoice_nr || "—"}
        <small style="display:block;color:var(--muted)">${p.confirmed ? "potwierdzona" : "czeka na potwierdzenie"}${p.note ? " · " + p.note : ""}</small></span>
      <b>${zl(p.amount)}</b></div>`).join("");

  shell(`
    <div class="sechead"><div><h2>Finanse</h2><p>Faktury zbiorcze i Twoje wpłaty.</p></div></div>
    <div class="kpis">
      <div class="kpi"><small>Do zapłaty</small><b>${zl(summary.due)}</b></div>
      <div class="kpi ${summary.overdue ? "warn" : ""}"><small>Po terminie</small><b>${zl(summary.overdue)}</b></div>
      <div class="kpi"><small>Bez faktury</small><b>${zl(summary.unbilled)}</b></div>
    </div>
    ${unbilled.length ? `<div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;margin-bottom:8px">Jeszcze bez faktury</h3>
      ${unbilled.map(u => `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px">
        <span>${fl(u.firma)} · ${u.count} zam.</span><b>${zl(u.gross)}</b></div>`).join("")}
      <p class="hint">Trafi na fakturę zbiorczą na koniec miesiąca.</p></div>` : ""}
    <h3 style="font-size:14px;margin:18px 0 10px">Faktury</h3>
    ${invRows || `<div class="card empty">Nie masz jeszcze żadnych faktur.</div>`}
    <h3 style="font-size:14px;margin:22px 0 10px">Wpłaty</h3>
    <div class="card">${payRows || `<div class="empty" style="padding:20px">Brak zgłoszonych wpłat.</div>`}</div>`);

  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => payForm(b.dataset.pay, b.dataset.left, b.dataset.nr));
}

function payForm(id, left, nr) {
  $("#dBody").innerHTML = `
    <div class="dhead">
      <div><h2 style="font-size:17px">Zgłoś wpłatę</h2>
        <p style="margin:2px 0 0;color:var(--muted);font-size:13px" class="mono">${nr}</p></div>
      <button class="x" data-close aria-label="Zamknij">×</button>
    </div>
    <p class="hint" style="margin-bottom:12px">Zgłoszenie trafia do nas do potwierdzenia. Saldo zmieni się po zaksięgowaniu przelewu.</p>
    <label class="f">Data wpłaty<input type="date" id="pd" value="${iso(new Date())}"></label>
    <label class="f" style="margin-top:10px">Kwota<input type="text" id="pa" inputmode="decimal" value="${left}"></label>
    <label class="f" style="margin-top:10px">Link do potwierdzenia (opcjonalnie)<input type="text" id="pu" placeholder="np. link do PDF z banku"></label>
    <label class="f" style="margin-top:10px">Uwagi<input type="text" id="pn"></label>
    <button class="btn primary wide" id="psend" style="margin-top:14px">Wyślij zgłoszenie</button>`;
  $("#scrim").hidden = false; $("#drawer").hidden = false;
  $("#drawer").querySelector(".x").onclick = closeDrawer;
  $("#scrim").onclick = closeDrawer;
  $("#psend").onclick = async () => {
    const amount = Number(($("#pa").value || "").replace(",", "."));
    if (!Number.isFinite(amount) || amount <= 0) return toast("Podaj kwotę", "bad");
    $("#psend").disabled = true;
    try {
      await api(`/invoices/${id}/payments`, { method: "POST", body: JSON.stringify({
        paid_date: $("#pd").value, amount,
        confirmation_url: $("#pu").value.trim() || null,
        note: $("#pn").value.trim() || null,
      }) });
      toast("Zgłoszenie wysłane"); closeDrawer(); await loadFinanse();
    } catch (e) { toast(e.message, "bad"); $("#psend").disabled = false; }
  };
}

// ── Katalog ──────────────────────────────────────────────────
// Katalog każdej firmy trzymamy osobno. Bez tego po przeskoczeniu na inną firmę
// koszyk tracił nazwy i ceny, bo pamiętaliśmy tylko ostatnio wczytaną listę.
async function ensureCatalog(firma) {
  if (state.catalogs[firma]) return state.catalogs[firma];
  try { state.catalogs[firma] = await api(`/catalog?firma=${firma}`); }
  catch (e) { state.catalogs[firma] = []; toast(e.message, "bad"); }
  return state.catalogs[firma];
}

async function loadCatalog() {
  shell(`<div class="empty">Wczytuję katalog…</div>`);
  await ensureCatalog(state.firma);
  renderCatalog();
}

const emptyCatalog = () =>
  `<div class="empty">${state.q ? "Nic nie pasuje do wyszukiwania." : "Katalog jest pusty — odezwij się do opiekuna."}</div>`;

// Przerysowanie samej listy: input zostaje w DOM, więc kursor nie ucieka na początek.
function paintProducts() {
  const el = $("#plist"); if (!el) return renderCatalog();
  el.innerHTML = productRows() || emptyCatalog();
  wireProducts();
  renderCartBar();
}

function productRows() {
  const q = state.q.toLowerCase();
  const list = (state.catalogs[state.firma] || []).filter(p => !q || (p.name + " " + p.sku).toLowerCase().includes(q));
  const c = cart();
  const rows2 = list.map(p => {
    const av = p.availability === "ok" ? `<span class="pill ok">Dostępny</span>`
      : p.availability === "low" ? `<span class="pill warn">Ostatnie sztuki</span>`
      : `<span class="pill bad">Brak${p.incoming ? ", w drodze" : ""}</span>`;
    const n = c[p.sku] || 0;
    const buy = p.availability === "out"
      ? `<button class="btn" disabled>Niedostępny</button>`
      : n ? `<div class="step"><button data-dec="${p.sku}">−</button><span>${n}</span><button data-inc="${p.sku}">+</button></div>`
          : `<button class="btn primary" data-add="${p.sku}">Dodaj</button>`;
    return `<article class="prod">
      ${thumb(p)}
      <div><h3>${p.name}</h3><div class="sku">${p.sku}</div><div class="prow">${av}</div></div>
      <div class="pbuy"><div class="price">${zl(p.price_net)}<small>netto</small></div>${buy}</div>
    </article>`;
  }).join("");
  return rows2;
}

function wireProducts() {
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { cart()[b.dataset.add] = 1; paintProducts(); });
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { cart()[b.dataset.inc]++; paintProducts(); });
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
    if (--cart()[b.dataset.dec] <= 0) delete cart()[b.dataset.dec];
    paintProducts();
  });
}

function renderCatalog() {
  const rows = productRows();
  shell(`
    <div class="sechead">
      <div><h2>Katalog</h2><p>Ceny netto z Twojego cennika.</p></div>
      <input type="search" id="q" placeholder="Szukaj po nazwie lub SKU" value="${state.q}" style="max-width:280px">
    </div>
    ${firmSwitch()}
    <div class="plist" id="plist">${rows || emptyCatalog()}</div>`);

  $("#q").oninput = e => { state.q = e.target.value; paintProducts(); };
  wireFirms();
  wireProducts();
}

function wireFirms() {
  document.querySelectorAll("[data-firma]").forEach(b => b.onclick = async () => {
    state.firma = b.dataset.firma;
    await ensureCatalog(state.firma);
    state.tab === "katalog" ? renderCatalog() : renderCart();
  });
}

// ── Koszyk ───────────────────────────────────────────────────
function renderCart() {
  const items = Object.entries(cart());
  if (!items.length) {
    shell(`<div class="sechead"><div><h2>Nowe zamówienie</h2><p>Jedno zamówienie to jedna firma i jedna wysyłka.</p></div></div>
      ${firmSwitch()}
      <div class="card empty"><p>Koszyk ${fl(state.firma)} jest pusty.</p>
      <button class="btn primary" style="margin-top:12px" data-tab="katalog">Otwórz katalog</button></div>`);
    wireFirms();
    $("[data-tab]").onclick = () => go("katalog");
    return;
  }
  const P = Object.fromEntries((state.catalogs[state.firma] || []).map(p => [p.sku, p]));
  const lines = items.map(([sku, q]) => `<div class="cline">
      ${thumb(P[sku] || { sku })}
      <div><div>${P[sku]?.name || sku}</div><div class="sku">${sku}</div></div>
      <div class="step"><button data-dec="${sku}">−</button><span>${q}</span><button data-inc="${sku}">+</button></div>
      <div class="lval">${zl((P[sku]?.price_net || 0) * q)}</div></div>`).join("");
  const net = items.reduce((s, [sku, q]) => s + (P[sku]?.price_net || 0) * q, 0);
  const gross = Math.round(net * 1.23 * 100) / 100;
  const pay = state.me.payment_mode === "przedplata"
    ? "Płatność z góry. Po złożeniu dostaniesz dane do przelewu, wysyłamy po zaksięgowaniu wpłaty."
    : `Trafi na fakturę zbiorczą ${fl(state.firma)} na koniec miesiąca.`;

  shell(`
    <div class="sechead"><div><h2>Nowe zamówienie</h2><p>Jedno zamówienie to jedna firma i jedna wysyłka.</p></div></div>
    ${firmSwitch()}
    <div class="grid2">
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px">Produkty</h3>${lines}</div>
      <div class="card">
        <h3 style="font-size:14px;margin-bottom:10px">Wysyłka</h3>
        <div class="seg">
          <label><input type="radio" name="mode" value="wlasna" checked>Moja etykieta</label>
          <label><input type="radio" name="mode" value="nasza">Wyślijcie wy</label>
        </div>
        <p class="hint" id="modeHint" style="margin-top:0"></p>

        <div class="seg" style="margin-top:14px">
          <label><input type="radio" name="typ" value="klient" checked>Do klienta</label>
          <label><input type="radio" name="typ" value="zbiorcze">Na mój adres</label>
        </div>
        <div id="fKlient">
          <div class="fgrid">
            <label class="f full">Imię i nazwisko<input type="text" id="fName"></label>
            <label class="f full">Ulica i numer<input type="text" id="fStreet"></label>
            <label class="f">Kod pocztowy<input type="text" id="fZip"></label>
            <label class="f">Miasto<input type="text" id="fCity"></label>
            <label class="f">Telefon<input type="tel" id="fPhone"></label>
            <label class="f">Nr zamówienia u Ciebie<input type="text" id="fRef" placeholder="opcjonalnie"></label>
          </div>
          <label class="check"><input type="checkbox" id="cod"> Za pobraniem</label>
          <p class="hint">Pobranie trafia na Twoje konto, więc przesyłkę nadajesz u siebie.</p>
        </div>
        <div id="fZbior" hidden>
          <p style="margin:0;font-size:14px">${state.me.address || "Adres z umowy"}</p>
          <p class="hint">Zmianę adresu zgłoś opiekunowi.</p>
        </div>

        <div id="labelBox" style="margin-top:12px">
          <label class="f">Link do etykiety (PDF)<input type="text" id="fLabel" placeholder="możesz dodać później"></label>
        </div>

        <dl class="sum"><dt>Netto</dt><dd>${zl(net)}</dd><dt>VAT 23%</dt><dd>${zl(gross - net)}</dd>
          <dt class="big">Brutto</dt><dd class="big">${zl(gross)}</dd></dl>
        <p class="hint">${pay}</p>
        <button class="btn primary wide" id="send" style="margin-top:12px">Złóż zamówienie</button>
      </div>
    </div>`);

  wireFirms();
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { cart()[b.dataset.inc]++; renderCart(); });
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
    if (--cart()[b.dataset.dec] <= 0) delete cart()[b.dataset.dec];
    renderCart();
  });

  const syncMode = () => {
    const own = $("input[name=mode]:checked").value === "wlasna";
    $("#modeHint").textContent = own
      ? "Nadajesz przesyłkę sam. Zamówienie czeka, aż wgrasz etykietę."
      : "Nadajemy my, swojego kuriera. Etykiety nie potrzebujesz.";
    $("#labelBox").hidden = !own;
  };
  document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = syncMode);
  syncMode();

  const syncTyp = () => {
    const k = $("input[name=typ]:checked").value === "klient";
    $("#fKlient").hidden = !k; $("#fZbior").hidden = k;
  };
  document.querySelectorAll("input[name=typ]").forEach(r => r.onchange = syncTyp);

  $("#send").onclick = async () => {
    const typ = $("input[name=typ]:checked").value;
    const mode = $("input[name=mode]:checked").value;
    const name = $("#fName").value.trim(), city = $("#fCity").value.trim();
    if (typ === "klient" && (!name || !city)) return toast("Uzupełnij nazwisko i miasto odbiorcy", "bad");
    $("#send").disabled = true;
    try {
      const o = await api("/orders", { method: "POST", body: JSON.stringify({
        firma: state.firma, typ, shipping_mode: mode,
        external_id: $("#fRef").value.trim() || null,
        recipient_name: typ === "klient" ? name : null,
        recipient_street: $("#fStreet").value.trim() || null,
        recipient_zip: $("#fZip").value.trim() || null,
        recipient_city: typ === "klient" ? city : null,
        recipient_phone: $("#fPhone").value.trim() || null,
        cod: $("#cod").checked,
        label_url: mode === "wlasna" ? ($("#fLabel").value.trim() || null) : null,
        lines: Object.entries(cart()).map(([sku, qty]) => ({ sku, qty })),
      }) });
      state.carts[state.firma] = {};
      toast(o.status === "etykieta" ? `Złożono ${o.nr}. Czeka na etykietę.`
        : o.status === "platnosc" ? `Złożono ${o.nr}. Czeka na płatność.` : `Złożono ${o.nr}.`);
      await go("zamowienia");
    } catch (e) { toast(e.message, "bad"); $("#send").disabled = false; }
  };
}

// ── Zamówienia ───────────────────────────────────────────────
function thisMonth() {
  const d = new Date(), f = new Date(d.getFullYear(), d.getMonth(), 1);
  return [iso(f), iso(d)];
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

async function loadOrders() {
  if (!state.od && !state.do) [state.od, state.do] = thisMonth();
  shell(`<div class="empty">Wczytuję zamówienia…</div>`);
  try { state.orders = await api(`/orders?od=${state.od}&do=${state.do}`); }
  catch (e) { state.orders = { orders: [], summary: {} }; toast(e.message, "bad"); }
  renderOrders();
}

function renderOrders() {
  const { orders = [], summary = {} } = state.orders || {};
  const rows = orders.map(o => {
    const [lbl, cls] = STATUS[o.status] || [o.status, "info"];
    return `<button class="orow" data-open="${o.nr}">
      <span class="onr mono" style="font-size:12.5px">${o.nr}</span>
      <span class="odate">${dm(o.created_at)}</span>
      <span class="oodb">${o.recipient?.name || "Na mój adres"}
        <small>${fl(o.firma)} · ${o.shipping_mode === "wlasna" ? "moja etykieta" : "wysyłka od Was"}${o.cod ? " · pobranie" : ""}${o.external_id ? " · " + o.external_id : ""}</small></span>
      <span class="oval">${zl(o.total_net)}</span>
      <span class="pill ${cls}">${lbl}</span>
    </button>`;
  }).join("");

  shell(`
    <div class="sechead">
      <div><h2>Zamówienia</h2><p>Statusy aktualizują się automatycznie.</p></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input type="date" id="od" value="${state.od}" style="width:auto">
        <span style="color:var(--muted)">–</span>
        <input type="date" id="do" value="${state.do}" style="width:auto">
        <button class="btn sm" data-range="month">Ten miesiąc</button>
        <button class="btn sm" data-range="prev">Poprzedni</button>
        <button class="btn sm" data-range="year">Ten rok</button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Zamówienia</small><b>${summary.count ?? 0}</b></div>
      <div class="kpi"><small>Wartość netto</small><b>${zl(summary.net)}</b></div>
      <div class="kpi ${summary.waiting ? "warn" : ""}"><small>Czeka na Ciebie</small><b>${summary.waiting ?? 0}</b></div>
    </div>
    <div class="olist">${rows || `<div class="empty">Brak zamówień w tym miesiącu.</div>`}</div>`);

  const apply = () => { state.od = $("#od").value; state.do = $("#do").value; loadOrders(); };
  $("#od").onchange = apply; $("#do").onchange = apply;
  document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => {
    const now = new Date();
    if (b.dataset.range === "month") [state.od, state.do] = thisMonth();
    if (b.dataset.range === "prev") {
      state.od = iso(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      state.do = iso(new Date(now.getFullYear(), now.getMonth(), 0));
    }
    if (b.dataset.range === "year") { state.od = `${now.getFullYear()}-01-01`; state.do = iso(now); }
    loadOrders();
  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openOrder(b.dataset.open));
}

function openOrder(nr) {
  const o = (state.orders?.orders || []).find(x => x.nr === nr);
  if (!o) return;
  const [lbl, cls] = STATUS[o.status] || [o.status, "info"];
  const needLabel = o.shipping_mode === "wlasna" && !["wyslane", "spakowane", "anulowane"].includes(o.status);
  $("#dBody").innerHTML = `
    <div class="dhead">
      <div><h2 class="mono" style="font-size:17px">${o.nr}</h2>
        <p style="margin:2px 0 0;color:var(--muted);font-size:13px">${fl(o.firma)} · ${dm(o.created_at)}${o.external_id ? " · " + o.external_id : ""}</p></div>
      <button class="x" data-close aria-label="Zamknij">×</button>
    </div>
    <div><span class="pill ${cls}">${lbl}</span></div>
    ${needLabel ? `<div class="callout warn">
      <p><b>${o.status === "etykieta" ? "Zamówienie czeka na etykietę." : "Możesz jeszcze podmienić etykietę."}</b></p>
      <label class="f">Link do etykiety (PDF)<input type="text" id="lbl" value="${o.label_url || ""}"></label>
      <button class="btn primary sm" id="lblSave" style="margin-top:8px">Zapisz etykietę</button></div>` : ""}
    <div class="dsec"><h3>Odbiorca</h3>
      <div style="font-size:13.5px">${o.recipient?.name || "—"}<br>${o.recipient?.street || ""} ${o.recipient?.zip || ""} ${o.recipient?.city || ""}<br>${o.recipient?.phone || ""}</div></div>
    ${o.tracking ? `<div class="dsec"><h3>Przesyłka</h3><div class="mono" style="font-size:13px">${o.tracking}</div></div>` : ""}
    <div class="dsec"><h3>Produkty</h3><table><tbody>
      ${o.items.map(i => `<tr><td>${i.name}<div class="sku">${i.sku}</div></td><td class="r">${i.qty}</td><td class="r">${zl(i.price_net * i.qty)}</td></tr>`).join("")}
      <tr><td><b>Razem</b></td><td></td><td class="r"><b>${zl(o.total_net)} netto</b><br><small>${zl(o.total_gross)} brutto</small></td></tr>
    </tbody></table></div>`;
  $("#scrim").hidden = false; $("#drawer").hidden = false;
  $("#drawer").querySelector(".x").onclick = closeDrawer;
  $("#scrim").onclick = closeDrawer;
  const save = $("#lblSave");
  if (save) save.onclick = async () => {
    const url = $("#lbl").value.trim();
    if (!url) return toast("Wklej link do pliku z etykietą", "bad");
    save.disabled = true;
    try {
      await api(`/orders/${encodeURIComponent(nr)}/label`, { method: "POST", body: JSON.stringify({ label_url: url }) });
      toast("Etykieta zapisana"); closeDrawer(); await loadOrders();
    } catch (e) { toast(e.message, "bad"); save.disabled = false; }
  };
}

function closeDrawer() { $("#scrim").hidden = true; $("#drawer").hidden = true; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// ── Start ────────────────────────────────────────────────────
async function boot() {
  try {
    state.me = await api("/me");
    state.firma = state.me.firmy[0];
    state.me.firmy.forEach(f => state.carts[f] ||= {});
    await go("katalog");
  } catch (e) { toast(e.message, "bad"); renderLogin(); }
}

function render() { state.token ? boot() : renderLogin(); }
render();
</script>
</body>
</html>
